[project]
name = "tgs-bot"
version = "1.0.0"
description = "Telegram bot that renders animated stickers into banners and builds custom emoji packs"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["webapp"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RET", "C4", "PIE", "PERF", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Cyrillic text in user-facing strings is intentional
    "E501",                        # long lines are left to the formatter
    "PERF401",
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]  # scripts extend sys.path before importing the app

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["config", "db", "states", "content", "handlers", "keyboards", "services", "utils"]
